<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLOCKED</title>
<style>
:root{--bg:#0b0d0b;--card:#14161a;--card2:#1b1e24;--line:#272a32;--g:#39ff14;--g2:#19b36b;--y:#f5ff3a;--r:#ff3b5c;--t:#f4f5f7;--m:#9aa0ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:radial-gradient(120% 60% at 50% -10%,#142013 0%,var(--bg) 55%);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(57,255,20,.05)}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 10px}
.logo{font-weight:900;font-size:27px;letter-spacing:-.5px;color:var(--g);line-height:1;text-shadow:0 0 22px rgba(57,255,20,.35)}.logo span{color:var(--y)}
.tag{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--m);margin-top:5px}
.tag b{color:var(--y);font-weight:800}
.pill{font-size:11px;font-weight:800;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--y);background:rgba(20,22,26,.7);cursor:pointer;transition:.2s}
.pill.on{border-color:var(--g);color:var(--g);box-shadow:0 0 14px rgba(57,255,20,.25)}
main{flex:1;overflow-y:auto;padding:6px 14px 96px;scroll-snap-type:y proximity;overscroll-behavior:contain}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:0 0 14px;margin-bottom:16px;scroll-snap-align:start;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.media{position:relative;height:158px;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 120% at 50% 0%,#1e2b1a 0%,#10130f 70%);border-bottom:1px solid var(--line);overflow:hidden}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,13,11,.55));pointer-events:none}
.media .memegif{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
.media canvas.bigcoin{width:132px;height:132px;z-index:1;filter:drop-shadow(0 8px 18px rgba(57,255,20,.25))}
.chip{position:absolute;top:10px;left:10px;z-index:2;background:rgba(6,8,6,.72);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--g)}
.chip.low{color:var(--y)}.chip.crit{color:var(--r);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.srcchip{position:absolute;top:10px;right:10px;z-index:2;background:rgba(6,8,6,.72);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:10px;font-weight:700;color:var(--m)}
.badge{position:absolute;right:12px;bottom:-22px;z-index:3;width:64px;height:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));animation:coinflip 3.2s cubic-bezier(.6,.05,.3,.95) infinite}
.badge img{width:100%;height:100%}
@keyframes coinflip{0%,18%{transform:rotateY(0)}50%,68%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.thumbtxt{font-size:44px;font-weight:900;color:var(--g);opacity:.9;text-shadow:0 0 30px rgba(57,255,20,.4)}
.body{padding:12px 14px 0}
.namerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name{font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.2px}
.tick{color:var(--g);font-weight:800;font-size:14px;letter-spacing:.4px;white-space:nowrap}
.src{color:var(--m);font-size:11.5px;margin-top:3px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.price{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.chg{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:9px}
.up{color:var(--g)}.dn{color:var(--r)}
.chg.up{background:rgba(57,255,20,.1)}.chg.dn{background:rgba(255,59,92,.12)}
.tl{font-size:11px;color:var(--m);font-weight:600;margin-top:6px}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:15.5px;letter-spacing:.2px;color:#04140a;background:linear-gradient(180deg,#5cff3d,var(--g) 60%,#25cc06);width:100%;margin-top:12px;cursor:pointer;box-shadow:0 6px 18px rgba(57,255,20,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.965)}
.btn.y{background:linear-gradient(180deg,#faff7a,var(--y) 60%,#d4e006);box-shadow:0 6px 18px rgba(245,255,58,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.dark{background:#26282f;color:var(--t);box-shadow:none}
.btn.fake{background:linear-gradient(180deg,#ff5c78,var(--r) 60%,#d91e42);color:#fff;box-shadow:0 6px 18px rgba(255,59,92,.2),inset 0 1px 0 rgba(255,255,255,.25)}
.btn[disabled]{opacity:.4;box-shadow:none}
.vote{display:flex;gap:10px}.vote .btn{margin-top:12px}
.voted{margin-top:12px;padding:15px 18px;border-radius:16px;text-align:center;font-weight:900;font-size:15.5px;letter-spacing:.2px}
.voted.real{background:rgba(57,255,20,.12);color:var(--g);border:1px solid rgba(57,255,20,.45)}
.voted.fake{background:rgba(255,59,92,.12);color:var(--r);border:1px solid rgba(255,59,92,.45)}
.voted small{display:block;margin-top:4px;color:var(--m);font-weight:600;font-size:11px;letter-spacing:0}
.bar{height:12px;background:#26282f;border-radius:9px;overflow:hidden;margin-top:12px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));transition:width .35s;border-radius:9px;position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:200% 100%;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.act{position:absolute;left:14px;right:14px;top:12px;transform:translateY(-8px);opacity:0;background:rgba(6,8,6,.85);backdrop-filter:blur(8px);border:1px solid var(--g);color:var(--g);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:12px;transition:.35s;pointer-events:none;z-index:6;text-align:center}
.act.on{opacity:1;transform:none}
nav{position:absolute;bottom:0;left:0;right:0;height:calc(70px + env(safe-area-inset-bottom));background:rgba(11,13,11,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--m);font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:color .2s;letter-spacing:.3px}
nav button.on{color:var(--g)}
nav button svg{width:23px;height:23px;fill:currentColor}
nav .plus{background:linear-gradient(180deg,#5cff3d,var(--g) 60%,#25cc06);color:#04140a;width:58px;height:58px;border-radius:50%;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:-30px;border:4px solid #0b0d0b;box-shadow:0 8px 22px rgba(57,255,20,.35);transition:transform .12s}
nav button:active .plus{transform:scale(.92)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#15171c;border-top:2px solid var(--g);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:20;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,.9,.3,1);box-shadow:0 -20px 60px #000;max-height:82%;overflow-y:auto}
.sheet.on{transform:none}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:99px;background:#3a3d47;margin:2px auto 12px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:19;display:none}.scrim.on{display:block}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.sub{color:var(--m);font-size:13px;margin-bottom:12px;line-height:1.45}
.amts{display:flex;gap:8px;margin:10px 0}
.amts button{flex:1;padding:12px 0;border-radius:13px;border:1px solid var(--line);background:#1d1f26;color:var(--t);font-weight:800;font-size:15px;cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums}
.amts button.on{border-color:var(--g);color:var(--g);background:rgba(57,255,20,.08);box-shadow:0 0 0 1px var(--g)}
.receipt{background:#0b0d0b;border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-size:15px;margin-top:12px}
.receipt div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.receipt .tot{border-top:1px dashed var(--line);margin-top:7px;padding-top:10px;font-weight:900;font-size:18px;color:var(--y)}
.split{font-size:12px;color:var(--m);margin-top:10px;line-height:1.55;background:rgba(57,255,20,.05);border:1px solid rgba(57,255,20,.15);border-radius:12px;padding:9px 11px}
input{width:100%;background:#0b0d0b;border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--t);font-size:15px;margin:6px 0;outline:none;transition:border-color .15s}
input:focus{border-color:var(--g)}
.sec{font-weight:900;font-size:12px;color:var(--y);margin:18px 2px 9px;letter-spacing:1.2px;text-transform:uppercase}
.lb{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:9px}
.lb b{width:22px;color:var(--y);font-variant-numeric:tabular-nums}
.lb span{flex:1;font-weight:700;line-height:1.3}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.stat small{color:var(--m);display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.stat b{font-size:21px;font-variant-numeric:tabular-nums}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.hide{display:none}
</style></head><body>
<div id="app">
<header>
  <div><div class="logo">CLOCK<span>ED</span></div><div class="tag">spot it · clock it · coin it · <b>demo</b></div></div>
  <button class="pill" id="wallet">Connect wallet</button>
</header>
<main id="main"></main>
<canvas id="fx"></canvas>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<nav>
  <button id="n-feed"><svg viewBox="0 0 24 24"><path d="M12.6 2.3c.5 3.6-3.9 5.1-3.9 9.2a5.3 5.3 0 0 0 10.6 0c0-1.9-.9-3.2-1.7-4.1-.4 1-1.1 1.7-2 2.1.5-2.8-1.2-6.1-3-7.2zM12 21.5a3.4 3.4 0 0 1-3.4-3.4c0-2 1.6-2.9 2.5-4.3.2 1.2.9 1.9 1.7 2.3.6-1 .7-2 .6-3.1 1.5 1.1 2.9 2.6 2.9 5.1a3.4 3.4 0 0 1-4.3 3.4z"/></svg>Feed</button>
  <button id="n-add"><div class="plus">+</div></button>
  <button id="n-bag"><svg viewBox="0 0 24 24"><path d="M12 1.8A10.2 10.2 0 1 0 12 22.2 10.2 10.2 0 0 0 12 1.8zm.9 15.5v1.5h-1.8v-1.5c-1.6-.2-2.9-1-3.2-2.5l1.7-.4c.3.9 1 1.4 2.3 1.4 1.2 0 1.9-.6 1.9-1.3 0-.8-.6-1.1-2.1-1.4-2-.4-3.3-1-3.3-2.9 0-1.5 1.1-2.6 2.7-2.9V5.2h1.8v1.5c1.5.2 2.7 1.1 3 2.6l-1.7.4c-.3-.8-.9-1.3-2.1-1.3-1.3 0-1.8.6-1.8 1.2 0 .8.7 1 2.2 1.4 2 .4 3.2 1.1 3.2 2.9 0 1.6-1.2 2.7-2.8 3z"/></svg>My Bag</button>
</nav>
</div>

 const frac=t.left/WIN;setRing(frac);ring.rotation.y=0;
 R.render(scene,cam);const x=cv.getContext('2d');x.clearRect(0,0,132,132);x.drawImage(R.domElement,0,0,132,132)}
/* ---------- confetti (separate lightweight scene) ---------- */
const FX=$('#fx');const R2=new THREE.WebGLRenderer({canvas:FX,alpha:true,antialias:false});R2.setPixelRatio(1);
const s2=new THREE.Scene(),c2=new THREE.PerspectiveCamera(50,1,.1,50);c2.position.z=10;let bits=[],fxOn=false;
const bg=new THREE.BoxGeometry(.18,.18,.04);
function burst(){const cols=[0x39ff14,0xf5ff3a,0xffffff,0xff3b5c];for(let i=0;i<70;i++){const m=new THREE.Mesh(bg,new THREE.MeshBasicMaterial({color:cols[i%4]}));
 m.position.set(0,-2,0);const a=Math.random()*Math.PI*2,sp=.08+Math.random()*.16;m.userData={v:new THREE.Vector3(Math.cos(a)*sp,.15+Math.random()*.2,Math.sin(a)*sp*.5),r:new THREE.Vector3(Math.random()*.3,Math.random()*.3,0),life:1};s2.add(m);bits.push(m)}
 if(!fxOn){fxOn=true;fit2();loopFx()}}
function fit2(){const w=$('#app').clientWidth,h=$('#app').clientHeight;R2.setSize(w,h,false);c2.aspect=w/h;c2.updateProjectionMatrix()}
function loopFx(){bits.forEach(m=>{const u=m.userData;m.position.add(u.v);u.v.y-=.006;m.rotation.x+=u.r.x;m.rotation.y+=u.r.y;u.life-=.009;m.material.opacity=1});
 bits=bits.filter(m=>{if(m.userData.life<=0){s2.remove(m);m.material.dispose();return false}return true});
 R2.render(s2,c2);if(bits.length)requestAnimationFrame(loopFx);else{fxOn=false;R2.clear()}}
/* ---------- UI ---------- */
function timerChip(t){return `<div class="chip" id="tm${t.id}">${mmss(t.left)} left</div>`}
function card(t,i){

 <div class="row"><div class="price" id="pr${t.id}">${fmt(t.price)}</div><div class="chg ${t.chg>=0?'up':'dn'}" id="ch${t.id}">${t.chg>=0?'▲':'▼'} ${Math.abs(t.chg).toFixed(1)}%</div></div>
 <div class="tl">early-bird window · price moves as people buy</div>
 <button class="btn" data-buy="${t.id}">BUY · ${fmt(FEE)} flat fee</button></div>`
 :`${media}
 <div class="body"><div class="namerow"><div class="name">${t.name}</div><div class="tick">$${t.tick}</div></div><div class="src">spotted by ${t.by} · in the voting sandbox</div>
 <div class="bar"><i id="vb${t.id}" style="width:${Math.min(100,t.votes)}%"></i></div>
 ${myVotes[t.id]?`<div class="voted ${myVotes[t.id]}">${myVotes[t.id]==='real'?'\u2713 YOU VOTED REAL':'\u2713 YOU VOTED FAKE'}<small>one vote per meme per person \u00b7 locked in</small></div>`:`<div class="vote"><button class="btn" data-vote="${t.id}:1">REAL</button><button class="btn fake" data-vote="${t.id}:0">FAKE</button></div>`}
 ${t.votes>=100&&t.mine?`<button class="btn y" data-launch="${t.id}">LAUNCH COIN · ${fmt(FEE)} flat fee</button>`:(t.mine?`<button class="btn dark" disabled>LAUNCH COIN unlocks at 100 REAL</button>`:'')}</div>`;
 return `<div class="card" id="c${t.id}" style="--d:${i*70}ms">${h}<div class="act" id="a${t.id}"></div></div>`}

 const hold=Object.keys(S.bag).map(id=>{const t=S.trends.find(x=>x.id==id),b=S.bag[id];const val=b.coins*t.price;const pl=val-b.cost;return `<div class="lb"><span>${t.meme?'<img src="'+TURTLE_PNG+'" style="width:26px;height:26px;vertical-align:-7px;margin-right:6px">':''}$${t.tick}<br><small style="color:var(--m)">${b.coins.toFixed(0)} coins · ${fmt(val)}</small></span><b class="${pl>=0?'up':'dn'}" style="width:auto">${pl>=0?'+':'-'}${fmt(Math.abs(pl))}</b></div>`}).join('')||'<div class="sub">No coins yet. Hit BUY on the feed.</div>';
 $('#main').innerHTML=`<div class="stat"><div><small>Cash (demo)</small><b>${fmt(S.cash)}</b></div><div><small>Spotter fees earned</small><b class="up">${fmt(S.spotterFees)}</b></div></div>
 <div class="sec">My coins · profit/loss</div>${hold}
 <div class="sec">Top spotters</div>${[['@maya','$TURTLES','$212.50'],['@sam','$MICH','$148.00'],['@jo','$FROG-HAT','$96.50'],['you','$AIRPORT (pending)',fmt(S.spotterFees)]].map((r,i)=>`<div class="lb"><b>${i+1}</b><span>${r[0]} <small style="color:var(--m)">${r[1]}</small></span><b class="up" style="width:auto">${r[2]}</b></div>`).join('')}`}

/* ---------- video -> GIF (client side, gif.js) ---------- */
let _workerScript;
async function newGif(){
 if(!_workerScript){const r=await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');const b=await r.blob();_workerScript=URL.createObjectURL(b)}
 return new GIF({workers:2,quality:11,width:320,height:190,workerScript:_workerScript})}
function coverDraw(x,v,w,h){const s=Math.max(w/v.videoWidth,h/v.videoHeight),dw=v.videoWidth*s,dh=v.videoHeight*s;x.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh)}
async function gifify(file,onprog){
 const gif=await newGif();
 const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
 await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('video would not load'))});
 const cv=document.createElement('canvas');cv.width=320;cv.height=190;const x=cv.getContext('2d');
 const N=14,span=Math.min(v.duration||3,3);
 for(let i=0;i<N;i++){v.currentTime=i*span/N;await new Promise(res=>{v.onseeked=res});coverDraw(x,v,320,190);gif.addFrame(cv,{copy:true,delay:Math.max(60,span/N*1000|0)});onprog&&onprog(i+1,N)}
 URL.revokeObjectURL(v.src);
 return new Promise(res=>{gif.on('finished',b=>res(URL.createObjectURL(b)));gif.render()})}
function addSheet(step=1,d={}){
 if(step===1)sheet(`<h2>Call out a trend</h2><div class="sub">Paste a TikTok, Instagram or X link</div><input id="lnk" placeholder="https://tiktok.com/@user/video/..." value="${d.l||''}"><button class="btn" id="fetch">FETCH PREVIEW</button><div class="sub" style="text-align:center;margin:12px 0 0">— or —</div><input type="file" id="vid" accept="video/*" class="hide"><button class="btn dark" id="gifbtn">GIF-IFY A VIDEO</button><div class="split" id="gifstat" style="display:none"></div>`);
 else sheet(`<h2>Looks good?</h2><div class="card" style="margin:8px 0;animation:none">${d.gif?`<div class="media"><img class="memegif" src="${d.gif}"></div>`:`<div class="media" style="height:90px"><div class="thumbtxt" style="font-size:26px">LINK</div></div>`}<div class="body" style="padding-bottom:12px"><div class="name">${d.gif?'Your GIF is ready':'Preview fetched'}</div><div class="src">${d.l}</div></div></div><input id="nm" placeholder="Trend name (e.g. I Like Turtles)"><input id="tk" placeholder="Ticker (e.g. TURTLES)" maxlength="12"><button class="btn" id="sendv">SEND TO VOTING SANDBOX</button>`)}

 if(b.id==='n-feed')tab('feed');else if(b.id==='n-bag')tab('bag');else if(b.id==='n-add')addSheet(1);
 else if(b.id==='scrim'||b.id==='cancel')closeSheet();
 else if(b.id==='wallet'){S.wallet=!S.wallet;b.textContent=S.wallet?'0x7a3…f21 · Robinhood Chain':'Connect wallet';b.classList.toggle('on',S.wallet)}
 else if(d.buy)buySheet(+d.buy);else if(d.launch)launchSheet(+d.launch);
 else if(d.amt){buyAmt=+d.amt;buySheet(buyId)}
 else if(d.vote){const[id,v]=d.vote.split(':').map(Number),t=S.trends.find(x=>x.id==id);if(myVotes[id])return;myVotes[id]=v?'real':'fake';try{localStorage.setItem('clocked_votes_v1',JSON.stringify(myVotes))}catch(e){}if(v)t.votes++;burst();if(S.tab==='feed')renderFeed()}
 else if(b.id==='confirm'){const t=S.trends.find(x=>x.id==buyId),cost=buyAmt+FEE;if(cost>S.cash){return}S.cash-=cost;const coins=buyAmt/t.price;const bg=S.bag[t.id]=S.bag[t.id]||{coins:0,cost:0};bg.coins+=coins;bg.cost+=buyAmt;
   t.price*=1+buyAmt/2500;t.chg+=buyAmt/40;S.spotterFees+=.5;closeSheet();burst();act(t.id,'You bought '+coins.toFixed(0)+' $'+t.tick+' · fee '+fmt(FEE))}
 else if(b.id==='confirmL'){const t=S.trends.find(x=>x.id==buyId);S.cash-=FEE;Object.assign(t,{live:true,left:WIN,price:0.05,chg:0});closeSheet();burst();renderFeed()}
 else if(b.id==='fetch'){const l=$('#lnk').value||'https://tiktok.com/@demo/video/123';addSheet(2,{l})}

});
