function sparkData(t){const out=[];let v=t.price*(1-Math.min(.9,Math.abs(t.chg)/100));
 let s=t.tick.length*7+t.tick.charCodeAt(0);
 const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
 for(let i=0;i<28;i++){out.push(v);v*=1+(rnd()-.42+(t.chg>0?.02:-.02))*.08}

function drawSpark(cv,data,up){const x=cv.getContext('2d');const w=cv.width=cv.clientWidth*2,h=cv.height=88;
 const mn=Math.min(...data),mx=Math.max(...data),rg=mx-mn||1;
 x.clearRect(0,0,w,h);
 const gy=i=>h-8-((data[i]-mn)/rg)*(h-16);
 const grad=x.createLinearGradient(0,0,0,h);const col=up?'57,255,20':'255,59,92';
 grad.addColorStop(0,`rgba(${col},.28)`);grad.addColorStop(1,`rgba(${col},0)`);
 x.beginPath();x.moveTo(0,gy(0));for(let i=1;i<data.length;i++)x.lineTo(i/(data.length-1)*w,gy(i));
 x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fillStyle=grad;x.fill();
 x.beginPath();x.moveTo(0,gy(0));for(let i=1;i<data.length;i++)x.lineTo(i/(data.length-1)*w,gy(i));
 x.strokeStyle=`rgb(${col})`;x.lineWidth=3;x.lineJoin='round';x.stroke()}

  R.render(scene,cam);C3=requestAnimationFrame(loop)};
 C3={raf:requestAnimationFrame(loop),R};
}
function stopCoin(){if(C3){cancelAnimationFrame(C3.raf);C3.R.dispose();C3=null}}

/* ---------- add / gif-ify ---------- */
let pendingGif=null,_workerScript;
async function newGif(){if(!_workerScript){const r=await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');const b=await r.blob();_workerScript=URL.createObjectURL(b)}
 return new GIF({workers:2,quality:11,width:320,height:190,workerScript:_workerScript})}
function coverDraw(x,v,w,h){const s=Math.max(w/v.videoWidth,h/v.videoHeight),dw=v.videoWidth*s,dh=v.videoHeight*s;x.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh)}
async function gifify(file,onprog){const gif=await newGif();
 const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
 await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('video would not load'))});
 const cv=document.createElement('canvas');cv.width=320;cv.height=190;const x=cv.getContext('2d');
 const N=14,span=Math.min(v.duration||3,3);
 for(let i=0;i<N;i++){v.currentTime=i*span/N;await new Promise(res=>{v.onseeked=res});coverDraw(x,v,320,190);gif.addFrame(cv,{copy:true,delay:Math.max(60,span/N*1000|0)});onprog&&onprog(i+1,N)}
 URL.revokeObjectURL(v.src);
 return new Promise(res=>{gif.on('finished',b=>res(URL.createObjectURL(b)));gif.render()})}
function addSheet(){pendingGif=null;
 sheet(`<h2>Spot a trend</h2><div class="sub">Call the trend before anyone else. 100 REAL votes launches your coin.</div>
 <input class="field" id="nm" placeholder="Trend name (e.g. I Like Turtles)">
 <input class="field" id="tk" placeholder="Ticker (e.g. TURTLES)" maxlength="10">
 <input class="field" id="ds" placeholder="Why is it trending? (your spotter pitch)">

 <div class="sub" style="margin:4px 0">Card art: upload any video and it becomes a looping GIF, on your device. Nothing uploads anywhere.</div>
 <button class="btn dark" id="gifbtn">🎞 GIF-IFY A VIDEO</button>
 <input type="file" id="vid" accept="video/*" style="display:none">
 <div id="gifstat"></div>
 <button class="btn" id="sendv" style="margin-top:10px">SPOT THIS TREND</button>
 <button class="btn dark" id="cancel" style="margin-top:9px">Cancel</button>`)}
/* ---------- confetti ---------- */
const FX=$('#fx');const R2=new THREE.WebGLRenderer({canvas:FX,alpha:true,antialias:false});R2.setPixelRatio(1);
const s2=new THREE.Scene(),c2=new THREE.PerspectiveCamera(50,1,.1,50);c2.position.z=10;let bits=[],fxOn=false;
const bg6=new THREE.BoxGeometry(.18,.18,.04);
function burst(){const cols=[0x39ff14,0xf5ff3a,0xffffff,0xff3b5c];for(let i=0;i<70;i++){const m=new THREE.Mesh(bg6,new THREE.MeshBasicMaterial({color:cols[i%4]}));
 m.position.set(0,-2,0);const a=Math.random()*Math.PI*2,sp=.08+Math.random()*.16;m.userData={v:new THREE.Vector3(Math.cos(a)*sp,.15+Math.random()*.2,Math.sin(a)*sp*.5),r:new THREE.Vector3(Math.random()*.3,Math.random()*.3,0),life:1};s2.add(m);bits.push(m)}
 if(!fxOn){fxOn=true;fit2();loopFx()}}
function fit2(){const w=$('#app').clientWidth,h=$('#app').clientHeight;R2.setSize(w,h,false);c2.aspect=w/h;c2.updateProjectionMatrix()}
function loopFx(){bits.forEach(m=>{const u=m.userData;m.position.add(u.v);u.v.y-=.006;m.rotation.x+=u.r.x;m.rotation.y+=u.r.y;u.life-=.009});
 bits=bits.filter(m=>{if(m.userData.life<=0){s2.remove(m);m.material.dispose();return false}return true});
 R2.render(s2,c2);if(bits.length)requestAnimationFrame(loopFx);else{fxOn=false;R2.clear()}}
/* ---------- trading engine (fake) ---------- */
function applyTrade(t,side,usd,who){
 const coins=t.price?usd/t.price:0;
 if(side==='buy'){t.price*=1+usd/8000;t.chg=(t.chg||0)+usd/150;if(t.raised!=null)t.raised=Math.min(GOAL,t.raised+usd)}
 else{t.price*=Math.max(.2,1-usd/9000);t.chg=(t.chg||0)-usd/180;if(t.raised!=null)t.raised=Math.max(0,t.raised-usd*.9)}
 if(t.trades)t.trades.unshift({side,who,usd,coins:Math.round(coins),at:Date.now()});
 FEED.unshift({who,side,usd,tick:t.tick,at:Date.now()});
 updateCoinUI(t);
 if(!isEst(t)&&t.raised>=GOAL&&!t.grad){t.grad=true;t.left=0;burst();act('🎓 $'+t.tick+' GRADUATED · curve complete');if(tab==='trending'||tab==='graduating')renderFeed()}
}
function updateCoinUI(t){
 const pr=document.getElementById('pr'+t.tick);if(pr)pr.textContent=fmtp(t.price);
 const ch=document.getElementById('ch'+t.tick);if(ch){ch.textContent=(t.chg>=0?'▲ ':'▼ ')+Math.abs(t.chg).toFixed(1)+'%';ch.className='chg '+(t.chg>=0?'up':'dn')}
 if(t.raised!=null){const pct=Math.min(100,t.raised/GOAL*100);
  const cv=document.getElementById('cv'+t.tick);if(cv)cv.textContent=pct.toFixed(0)+'% · '+fmt(t.raised)+' / $10k';
  const cb=document.getElementById('cb'+t.tick);if(cb)cb.style.width=pct+'%';
  const hg=document.getElementById('hg'+t.tick);if(hg)hg.textContent=pct.toFixed(0)+'% to Graduation'}
 const sp=document.getElementById('sp'+t.tick);if(sp)drawSpark(sp,sparkData(t),(t.chg||0)>=0);
}

document.addEventListener('click',e=>{const b=e.target.closest('button,.dtab,.details,.watchbtn,#scrim,.view,.backit');if(!b)return;const d=b.dataset||{};
 if(b.id==='n-feed')setMode('feed');else if(b.id==='n-bag')setMode('wallet');else if(b.id==='n-add')addSheet();

 else if(b.id==='confirmL'){const t=byTick(buyTick);if(cash<FEE){act('Not enough demo cash');return}
  cash-=FEE;Object.assign(t,{live:true,left:WIN,price:0.05,chg:0,real:100,raised:100,grad:false});
  t.trades=t.trades||[];t.trades.unshift({side:'launch',who:'you',usd:FEE,coins:0,at:Date.now()});
  t.holders=[{who:'you',pct:100}];
  FEED.unshift({who:'you',side:'launch',usd:FEE,tick:t.tick,at:Date.now()});
  save();burst();closeSheet();setMode('feed');setTab('trending');act('$'+t.tick+' IS LIVE · 30:00 early window')}
 else if(b.id==='confirm'){const t=byTick(buyTick);
  const cv=parseFloat(($('#customamt')||{}).value);const amt=!isNaN(cv)&&cv>0?Math.round(cv*100)/100:buyAmt;
